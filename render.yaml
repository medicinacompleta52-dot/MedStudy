services:
  - type: web
    name: medstudy-secure
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeployTrigger: commit
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: PLAN_MONTHLY_DISPLAY
        value: R$ 80/mês
      - key: PLAN_ANNUAL_DISPLAY
        value: R$ 500/ano
      - key: PLAN_LIFETIME_DISPLAY
        value: R$ 750, pagamento único
      - key: PLAN_VIP_DISPLAY
        value: R$ 1.000, vitalício com download de vídeos
