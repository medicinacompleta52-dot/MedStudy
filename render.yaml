services:
  - type: web
    name: medstudy-secure
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ANNUAL
        sync: false
      - key: STRIPE_PRICE_LIFETIME
        sync: false
      - key: PLAN_MONTHLY_DISPLAY
        value: R$ 80/mês
      - key: PLAN_ANNUAL_DISPLAY
        value: R$ 500/ano
      - key: PLAN_LIFETIME_DISPLAY
        value: R$ 750, pagamento único
